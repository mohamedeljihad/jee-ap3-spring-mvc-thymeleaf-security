<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{template1}">
<head><title>Nouveau produit</title></head>
<body>
<div layout:fragment="content1" class="col-md-6 offset-md-3">
    <div class="card">
        <div class="card-header">Nouveau produit</div>
        <div class="card-body">
            <form method="post" th:action="@{/admin/saveProduct}" th:object="${product}">
                <div class="mb-3">
                    <label class="form-label">Nom</label>
                    <input class="form-control" type="text" th:field="*{name}">
                    <span class="text-danger" th:errors="*{name}"></span>
                </div>
                <div class="mb-3">
                    <label class="form-label">Prix</label>
                    <input class="form-control" type="number" step="0.01" th:field="*{price}">
                    <span class="text-danger" th:errors="*{price}"></span>
                </div>
                <div class="mb-3">
                    <label class="form-label">Quantité</label>
                    <input class="form-control" type="number" th:field="*{quantity}">
                    <span class="text-danger" th:errors="*{quantity}"></span>
                </div>
                <button class="btn btn-primary" type="submit"><i class="bi bi-save"></i> Enregistrer</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
